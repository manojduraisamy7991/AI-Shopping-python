services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ecomer-postgres
    environment:
      POSTGRES_USER: ecomer
      POSTGRES_PASSWORD: ecomer
      POSTGRES_DB: ecomer
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  postgres-data:
